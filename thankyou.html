<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — WanderSphere Travel</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Shared CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==========================================
       THANK YOU PAGE
       ========================================== -->
  <div class="thankyou-page">
    <div class="thankyou-card">
      <!-- Confetti Emoji -->
      <span class="confetti">🎉</span>

      <!-- Green Checkmark Icon -->
      <div class="thankyou-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <!-- Thank You Message -->
      <h1>Thank You!</h1>
      <p>Thanks for reaching out! We'll get back to you soon. Our travel experts are already working on crafting the perfect journey for you.</p>

      <!-- Navigation Buttons -->
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
      <div style="margin-top:1.5rem;">
        <a href="destinations.html" class="btn btn-outline" style="font-size:0.9rem; padding: 0.6rem 1.5rem;">
          <i class="fa-solid fa-compass"></i> Explore Destinations
        </a>
      </div>
    </div>
  </div>

  <!-- Shared JavaScript -->
  <script src="script.js"></script>
</body>
</html>
